name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly real-model smoke test (only the `smoke` job runs on schedule)
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows CI from Phase 0 — path/process regressions are caught here
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck + lint + format + test)
        run: bun run verify

  # Scheduled real-model smoke test — catches provider/API drift.
  # Requires OPENROUTER_API_KEY repository secret; never runs on push/PR.
  smoke:
    name: real-model smoke (scheduled)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HARNESS_SMOKE_MODEL: ${{ vars.HARNESS_SMOKE_MODEL }}
        run: bun run smoke
